<!doctype html>
<html lang="ka">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2472b9">
  <meta name="description" content="I კლასის მათემატიკის ინტერაქციული სასწავლო აპლიკაცია">
  <title>I კლასის მათემატიკა</title>
  <link rel="preload" as="image" href="assets/characters/girl-back.png" fetchpriority="high">
  <link rel="preload" as="image" href="assets/characters/boy-back.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true"><span>1</span></div>
      <div class="brand-copy">
        <p>მათემატიკა · I კლასი</p>
        <h1>მოვემზადოთ მათემატიკისთვის</h1>
      </div>
      <button class="sound-btn" id="soundBtn" type="button" aria-label="ხმის ჩართვა ან გამორთვა">🔊</button>
    </header>

    <nav class="lesson-strip" id="lessonStrip" aria-label="გაკვეთილები"></nav>

    <section class="learning-card" aria-live="polite">
      <div class="lesson-heading">
        <div>
          <p class="eyebrow" id="lessonCount">გაკვეთილი 1 · 3-დან</p>
          <h2 id="lessonTitle">მარჯვნივ, მარცხნივ, შორის</h2>
        </div>
        <div class="stars" id="stars" aria-label="მიღებული ვარსკვლავები">☆ ☆ ☆</div>
      </div>

      <div class="stage-tabs" role="tablist" aria-label="სასწავლო ეტაპები">
        <button class="stage-tab active" data-stage="learn" role="tab">ნახე და გაიგე</button>
        <button class="stage-tab" data-stage="practice" role="tab">ივარჯიშე</button>
        <button class="stage-tab" data-stage="check" role="tab">შეამოწმე</button>
      </div>

      <div id="stageContent"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
