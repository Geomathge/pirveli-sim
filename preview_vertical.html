<style>:root {
  --blue: #2472b9;
  --blue-deep: #15548d;
  --sky: #eaf6ff;
  --sky-2: #d9efff;
  --ink: #233143;
  --muted: #66758a;
  --line: #c9dff0;
  --green: #3ba66b;
  --yellow: #ffcf55;
  --coral: #f47c6c;
  --surface: #ffffff;
  --shadow: 0 18px 55px rgba(32, 88, 131, .14);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 5% 0%, rgba(110, 197, 255, .24), transparent 28rem),
    linear-gradient(180deg, #f8fcff 0%, #eef7fd 100%);
  font-family: "Noto Sans Georgian", "Sylfaen", system-ui, sans-serif;
}

button { font: inherit; }

.app-shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 22px 0 48px; }

.topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.brand-mark { width: 62px; height: 62px; border: 5px solid var(--blue); border-radius: 50%; display: grid; place-items: center; color: var(--blue); background: white; box-shadow: 0 8px 24px rgba(36, 114, 185, .14); position: relative; flex: 0 0 auto; }
.brand-mark::before { content: ""; position: absolute; width: 5px; height: 26px; background: var(--blue); top: -28px; border-radius: 4px; }
.brand-mark span { font-size: 1.75rem; font-weight: 900; }
.brand-copy { flex: 1; }
.brand-copy p, .eyebrow { margin: 0 0 4px; color: var(--blue); font-weight: 800; font-size: .86rem; }
.brand-copy h1 { margin: 0; color: var(--blue-deep); font-size: clamp(1.25rem, 3vw, 2rem); line-height: 1.2; }
.sound-btn { border: 1px solid var(--line); width: 48px; height: 48px; border-radius: 50%; background: white; cursor: pointer; font-size: 1.2rem; }

.lesson-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 9px; margin: 0 0 18px; }
.lesson-pill { border: 1px solid var(--line); min-height: 54px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.82); color: var(--blue-deep); font-weight: 800; cursor: pointer; transition: transform .18s, background .18s, border-color .18s; }
.lesson-pill:hover { transform: translateY(-2px); }
.lesson-pill.active { color: white; background: var(--blue); border-color: var(--blue); box-shadow: 0 8px 22px rgba(36,114,185,.24); }
.lesson-pill.quiz { color: #805c00; background: #fff5d1; border-color: #f2d173; }
.lesson-pill.quiz.active { color: #604300; background: var(--yellow); }

.learning-card, .quiz-card { background: rgba(255,255,255,.96); border: 1px solid rgba(177,211,235,.8); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.lesson-heading, .quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 24px 28px 18px; }
.lesson-heading h2, .quiz-top h2 { margin: 0; color: var(--blue-deep); font-size: clamp(1.35rem, 3vw, 2.05rem); }
.stars { color: #e6a900; font-size: 1.55rem; letter-spacing: 4px; white-space: nowrap; }

.stage-tabs { display: flex; gap: 8px; padding: 0 28px 18px; border-bottom: 1px solid #e7f0f7; }
.stage-tab { border: 0; border-radius: 999px; padding: 11px 18px; color: var(--muted); background: #f2f6f9; font-weight: 800; cursor: pointer; }
.stage-tab.active { color: white; background: var(--blue); }

.stage-panel { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(250px, .65fr); gap: 24px; padding: 28px; min-height: 470px; }
.activity-area { min-width: 0; }
.instruction { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
.instruction-number { flex: 0 0 auto; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: white; background: var(--blue); font-weight: 900; }
.instruction h3 { margin: 0 0 5px; font-size: 1.2rem; }
.instruction p { margin: 0; color: var(--muted); line-height: 1.55; }
.child-instruction { align-items: center; }
.child-instruction > div { flex: 1; }
.listen-btn { flex: 0 0 auto; width: 58px; height: 58px; border: 0; border-radius: 50%; background: var(--blue); color: white; font-size: 1.45rem; cursor: pointer; box-shadow: 0 8px 20px rgba(36,114,185,.25); }
.listen-btn:focus-visible, .hand-hotspot:focus-visible, .move-arrow:focus-visible, .relation-zone:focus-visible { outline: 4px solid var(--yellow); outline-offset: 4px; }
.character-picker { display: flex; justify-content: center; gap: 14px; margin: 8px 0 14px; }
.character-choice { width: 82px; min-height: 96px; padding: 7px; border: 2px solid var(--line); border-radius: 22px; background: white; cursor: pointer; display: grid; place-items: center; box-shadow: 0 5px 14px rgba(43,89,122,.08); }
.character-choice img { width: 58px; height: 82px; object-fit: contain; }
.character-choice.selected { border-color: var(--blue); background: #eaf6ff; box-shadow: 0 0 0 4px rgba(41,125,190,.13); }
.character-choice:focus-visible { outline: 4px solid var(--yellow); outline-offset: 3px; }

.scene { position: relative; min-height: 325px; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; background: linear-gradient(#f1faff 0 68%, #dcefc9 68% 100%); }
.scene::after { content: ""; position: absolute; left: 0; right: 0; bottom: 30%; height: 2px; background: rgba(71,132,176,.15); }
.scene-label { position: absolute; z-index: 3; top: 14px; left: 16px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--blue-deep); font-weight: 800; box-shadow: 0 4px 15px rgba(26,74,111,.1); }
.character { position: absolute; z-index: 2; height: 190px; width: 130px; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 8px 5px rgba(30,68,94,.14)); }
.character.boy { left: 20%; bottom: 35px; }
.character.girl { right: 20%; bottom: 35px; }
.object-img { position: absolute; z-index: 2; width: 100px; height: 100px; object-fit: contain; }
.reference-dot { position: absolute; left: 50%; top: 49%; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: var(--coral); box-shadow: 0 0 0 7px rgba(244,124,108,.18); }

.direction-stage { grid-template-columns: minmax(0, 1fr) 250px; }
.body-board { min-height: 390px; display: grid; grid-template-columns: 1fr minmax(180px, 260px) 1fr; align-items: center; gap: 18px; border: 2px solid var(--line); border-radius: 24px; padding: 18px; overflow: hidden; background: linear-gradient(#eff9ff 0 74%, #dff1cf 74% 100%); }
.avatar-wrap { position: relative; align-self: stretch; min-height: 350px; display: grid; place-items: center; }
.back-avatar { height: 340px; width: 230px; max-width: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 9px 7px rgba(30,68,94,.15)); }
.back-avatar.face-left { transform: scaleX(-1); }
.back-avatar.travel-right { animation: bodyStepRight .68s ease-in-out forwards; }
.back-avatar.travel-left { animation: bodyStepLeft .68s ease-in-out forwards; }
.back-avatar.step-b.travel-right { animation-name: bodyStepRightAlt; }
.back-avatar.step-b.travel-left { animation-name: bodyStepLeftAlt; }
.hand-hotspot { position: absolute; z-index: 4; top: 47%; width: 62px; height: 62px; border: 3px solid rgba(255,255,255,.96); border-radius: 50%; background: rgba(255,207,85,.88); box-shadow: 0 0 0 9px rgba(255,207,85,.25), 0 8px 18px rgba(70,95,117,.18); cursor: pointer; animation: handPulse 1.25s ease-in-out infinite; }
.hand-hotspot::after { content: ""; position: absolute; inset: 19px; border-radius: 50%; background: white; }
.hand-hotspot.left-hand { left: 12%; }
.hand-hotspot.right-hand { right: 12%; }
.hand-actions-bar { grid-column: 1 / -1; display: flex; justify-content: center; gap: 16px; margin-top: 6px; }
.hand-action-btn { display: inline-flex; align-items: center; gap: 9px; min-height: 52px; padding: 8px 20px; border: 2px solid var(--blue); border-radius: 18px; background: white; color: var(--blue-deep); font-family: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(41,125,190,.1); transition: all .18s ease; }
.hand-action-btn:hover { background: #eaf6ff; transform: translateY(-1px); }
.hand-action-btn.active { background: #ffcf55; border-color: #d99100; color: #4a3000; box-shadow: 0 0 0 4px rgba(255,207,85,.35); transform: scale(1.03); }
.hand-action-btn .btn-hand-icon,
.btn-hand-icon {
  font-size: 1.35rem;
  display: inline-block;
  line-height: 1;
  transition: transform .18s ease;
}
.hand-action-btn[data-hand="right"] .btn-hand-icon,
.hand-action-btn .btn-hand-icon.right-hand,
.btn-hand-icon.right-hand,
.hand-icon-right {
  transform: scaleX(-1);
  display: inline-block;
}
.direction-sign { display: grid; place-items: center; gap: 3px; color: var(--blue-deep); font-weight: 900; }
.direction-sign span { font-family: system-ui, sans-serif; font-size: clamp(4.5rem, 9vw, 7rem); line-height: .85; }
.direction-sign small { font-size: 1rem; }
.left-sign span, .brown { color: #aa7b68; }
.right-sign span, .blue { color: #08a7df; }
.scene-sign { position: absolute; z-index: 4; bottom: 20px; }
.scene-sign.left-sign { left: 25px; }
.scene-sign.right-sign { right: 25px; }
.back-character { object-position: center bottom; }
.success-badge { position: absolute; right: 7%; top: 8%; display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; background: var(--green); color: white; font-size: 2rem; font-weight: 900; box-shadow: 0 8px 20px rgba(59,166,107,.25); }
.step-dots { display: flex; justify-content: center; gap: 10px; margin: 14px 0 2px; }
.step-dots i { width: 13px; height: 13px; border-radius: 50%; background: #d6e3ec; }
.step-dots i.done { background: var(--green); }
.picture-note .speech { font-size: 1.05rem; }
.mini-arrow { font-family: system-ui, sans-serif; font-size: 2rem; font-weight: 900; vertical-align: middle; }

.stair-stage { grid-template-columns: minmax(0, 1fr) 260px; }
.stair-object-picker { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 0 0 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 18px; background: #f7fbfe; }
.stair-object-picker > strong { color: var(--blue-deep); font-size: .9rem; margin-right: 4px; }
.stair-object-picker button { display: inline-flex; align-items: center; gap: 7px; min-height: 50px; padding: 4px 12px 4px 7px; border: 2px solid #d5e5ef; border-radius: 15px; background: white; color: var(--blue-deep); font: inherit; font-weight: 900; cursor: pointer; }
.stair-object-picker button.selected { border-color: #287abb; background: #eaf5fc; box-shadow: 0 0 0 2px rgba(40,122,187,.12); }
.stair-object-picker img { width: 38px; height: 43px; object-fit: contain; }
.compact-picker { margin: -2px 0 8px; }
.compact-picker .character-choice { width: 66px; min-height: 76px; border-radius: 17px; }
.compact-picker .character-choice img { width: 42px; height: 61px; }
.stair-interactive-board { min-height: 410px; display: grid; grid-template-columns: 102px minmax(430px, 1fr) 102px; align-items: center; gap: 12px; padding: 16px; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; background: linear-gradient(#eff9ff 0 78%, #dff1cf 78% 100%); }
.dual-stair-board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.stair-demo-card { min-width: 0; padding: 14px; border: 2px solid var(--line); border-radius: 24px; background: linear-gradient(#eff9ff 0 82%, #dff1cf 82% 100%); overflow: hidden; }
.stair-demo-card h4 { margin: 0 0 4px; text-align: center; color: var(--blue-deep); font-size: 1.05rem; }
.stair-demo-action { display: grid; grid-template-columns: minmax(300px, 1fr) 72px; align-items: center; gap: 7px; }
.stair-demo-action .number-staircase { min-width: 300px; height: 370px; }
.stair-demo-action .stair-control { min-height: 108px; padding: 5px; }
.stair-demo-action .stair-control span { font-size: 3.8rem; }
.stair-demo-action .stair-control small { font-size: .78rem; }
.stair-control { display: grid; place-items: center; align-content: center; gap: 5px; min-height: 126px; border: 2px solid var(--line); border-radius: 21px; background: white; color: var(--blue-deep); font-weight: 900; cursor: pointer; }
.stair-control span { font-family: system-ui, sans-serif; font-size: 4.6rem; line-height: .75; }
.stair-control small { font-size: .92rem; }
.stair-up span { color: #20a866; }
.stair-down span { color: #aa7b68; }
.number-staircase { position: relative; height: 360px; min-width: 430px; overflow: visible; isolation: isolate; }
.stair-columns { position: absolute; z-index: 1; inset: 12px 0 4px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; gap: 7px; }
.stair-column { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch; }
.stair-cubes { display: flex; flex-direction: column-reverse; }
.stair-cubes i { display: block; height: 42px; margin-top: 2px; border: 3px solid rgba(38,92,125,.18); border-radius: 9px; box-shadow: inset 0 4px 7px rgba(255,255,255,.55), inset 0 -4px 7px rgba(0,0,0,.10); }
.stair-column strong { height: 42px; display: grid; place-items: center; font-size: 2rem; line-height: 1; text-shadow: 0 2px 0 white; }
.stair-red i { background: #ef5757; } .stair-red strong { color: #d73342; }
.stair-blue i { background: #6fa6df; } .stair-blue strong { color: #326bb6; }
.stair-green i { background: #86c741; } .stair-green strong { color: #4e9c24; }
.stair-purple i { background: #a76bc3; } .stair-purple strong { color: #83449f; }
.stair-cyan i { background: #72d0e8; } .stair-cyan strong { color: #28a9cc; }
.stair-avatar { position: absolute; z-index: 5; width: 76px; height: 110px; overflow: visible; object-fit: contain; object-position: center bottom; opacity: 1 !important; visibility: visible !important; filter: drop-shadow(0 7px 5px rgba(30,68,94,.18)); transform: translateX(-50%); transition: none !important; }
.number-staircase.level-0 .stair-avatar { left: 10%; bottom: 71px; }
.number-staircase.level-1 .stair-avatar { left: 30%; bottom: 115px; }
.number-staircase.level-2 .stair-avatar { left: 50%; bottom: 159px; }
.number-staircase.level-3 .stair-avatar { left: 70%; bottom: 203px; }
.number-staircase.level-4 .stair-avatar { left: 90%; bottom: 247px; }
.number-staircase.ascending.level-4 .book-stair-child { left: 84%; }
.number-staircase.descending.level-4 .stair-avatar { left: 10%; bottom: 247px; }
.number-staircase.descending.level-3 .stair-avatar { left: 30%; bottom: 203px; }
.number-staircase.descending.level-2 .stair-avatar { left: 50%; bottom: 159px; }
.number-staircase.descending.level-1 .stair-avatar { left: 70%; bottom: 115px; }
.number-staircase.descending.level-0 .stair-avatar { left: 90%; bottom: 71px; }
.book-stair-child { width: 112px; height: 155px; }
.rabbit-stair-avatar { width: 104px; height: 126px; }
.stair-avatar.step-a { transform: translateX(-50%) rotate(2deg); }
.stair-avatar.step-b { transform: translateX(-50%) rotate(-2deg); }
.book-stair-note figure { margin: 0; padding: 8px; border: 1px solid var(--line); border-radius: 18px; background: white; text-align: center; }
.book-stair-note figure img { width: 100%; height: 155px; object-fit: contain; }
.book-stair-note figcaption { color: var(--blue-deep); font-weight: 900; font-size: .88rem; }

.movement-board { min-height: 340px; display: grid; grid-template-columns: 140px 1fr 140px; align-items: center; gap: 16px; border: 2px solid var(--line); border-radius: 24px; padding: 20px; background: linear-gradient(#eff9ff 0 73%, #dff1cf 73% 100%); overflow: hidden; }
.movement-track { position: relative; align-self: stretch; min-width: 260px; overflow: hidden; }
.movement-track i { position: absolute; left: 4%; right: 4%; bottom: 56px; height: 4px; border-radius: 4px; background: repeating-linear-gradient(90deg, #9fc5df 0 18px, transparent 18px 32px); }
.moving-avatar { position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%); height: 250px; width: 180px; max-width: 45%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 9px 7px rgba(30,68,94,.14)); transition: left .26s ease-out; }
.moving-avatar.face-left { transform: translateX(-50%) scaleX(-1); }
.moving-avatar.travel-right { animation: walkRight .68s ease-in-out forwards; }
.moving-avatar.travel-left { animation: walkLeft .68s ease-in-out forwards; }
.move-arrow { display: grid; place-items: center; gap: 5px; min-height: 132px; border: 2px solid var(--line); border-radius: 22px; background: white; cursor: pointer; font-weight: 900; color: var(--blue-deep); }
.move-arrow span { font-family: system-ui, sans-serif; font-size: 5rem; line-height: .75; }
.move-left span { color: #aa7b68; }
.move-right span { color: #08a7df; }
.combined-control-board { grid-template-columns: minmax(92px, 130px) minmax(180px, 260px) minmax(92px, 130px); justify-content: space-between; }
.compact-move { width: min(100%, 126px); min-height: 112px; justify-self: center; }
.compact-move span { font-size: 4rem; }
.combined-control-board .avatar-wrap { overflow: visible; }

.handshake-board { min-height: 390px; display: grid; grid-template-columns: 110px minmax(260px, 1fr) 110px; align-items: center; gap: 12px; padding: 18px; border: 2px solid var(--line); border-radius: 24px; background: linear-gradient(#eff9ff 0 74%, #dff1cf 74% 100%); overflow: hidden; }
.handshake-board img { width: 100%; height: 350px; object-fit: contain; filter: drop-shadow(0 9px 7px rgba(30,68,94,.14)); }
.face-practice-board { min-height: 390px; display: grid; place-items: center; padding: 14px; border: 2px solid var(--line); border-radius: 24px; background: linear-gradient(#eff9ff 0 74%, #dff1cf 74% 100%); overflow: hidden; }
.face-practice-board img { grid-area: 1 / 1; width: min(100%, 600px); height: 360px; object-fit: contain; filter: drop-shadow(0 9px 7px rgba(30,68,94,.14)); }
.face-practice-board .face-pose { visibility: hidden; opacity: 0; pointer-events: none; }
.face-practice-board .face-pose.active { visibility: visible; opacity: 1; }
.face-action { display: grid; place-items: center; gap: 5px; text-align: center; }
.face-action span { font-family: system-ui, sans-serif; font-size: 2rem; line-height: 1; }
.practice-stage-full { grid-template-columns: 1fr; }
.practice-command { flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 20px; background: #f8fcff; }
.practice-command .listen-btn { width: 52px; height: 52px; }
.face-command-actions { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.face-command-actions button { min-height: 60px; padding: 10px 12px; }
.mirrored-pair { transform: scaleX(-1); }
.inline-face-action { min-width: 210px; display: flex; grid-auto-flow: column; gap: 9px; }
.inline-face-action span { font-size: 1.45rem; }
.practice-next { display: block; margin: 14px 0 0 auto; }

.relation-board { min-height: 320px; display: grid; grid-template-columns: 1fr 190px 1fr; align-items: stretch; gap: 14px; padding: 18px; border: 2px solid var(--line); border-radius: 24px; background: #f9fcff; }
.fixed-object { display: grid; place-items: center; }
.fixed-object img { width: 150px; height: 180px; object-fit: contain; filter: drop-shadow(0 8px 6px rgba(30,68,94,.12)); }
.relation-zone { display: grid; place-items: center; align-content: center; gap: 5px; min-height: 270px; border: 3px dashed #a9cde8; border-radius: 22px; background: white; color: var(--blue-deep); font-weight: 900; cursor: pointer; }
.relation-zone.hover { border-color: var(--green); background: #effbf4; }
.relation-zone.correct { border-style: solid; border-color: var(--green); background: #effbf4; }
.zone-symbol { font-family: system-ui, sans-serif; font-size: 5rem; line-height: .8; }
.relation-zone small { font-size: 1rem; }
.between-board .fixed-object img { width: 135px; }
.middle-zone .zone-symbol { color: #846bc3; }
.compact-tray { min-height: 100px; }
.back-token { height: 92px; }
.relation-zone .back-token { height: 170px; width: 110px; }
.object-check-board .fixed-object img { width: 170px; height: 175px; }
.object-tray { border-radius: 18px; background: #f3f9fd; }
.object-token { width: 120px; height: 105px; object-fit: contain; }
.relation-zone .object-token { width: 125px; height: 125px; }
.lesson-result { min-height: 430px; display: grid; place-items: center; align-content: center; }

@keyframes handPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes walkRight {
  0%, 49% { transform: translateX(-50%) rotate(0); }
  49.1% { transform: translateX(calc(-50% + 42px)) rotate(1.4deg); }
  100% { transform: translateX(calc(-50% + 42px)) rotate(0); }
}

@keyframes walkLeft {
  0%, 49% { transform: translateX(-50%) rotate(0); }
  49.1% { transform: translateX(calc(-50% - 42px)) rotate(-1.4deg); }

    const holder = avatar.closest(".avatar-wrap");
    const from = walkPosition * 42;
    const directionStep = direction === "right" ? 1 : -1;
    const nextPosition = Math.max(-3, Math.min(3, walkPosition + directionStep));
    const to = nextPosition * 42;
    if (nextPosition === walkPosition) return false;
    walkPosition = nextPosition;
    advanceDirectionalWalkFrame(avatar, direction);
    const motion = holder.animate([
      { transform: `translateX(${from}px)` },
      { transform: `translateX(${to}px)` }
    ], {
      duration: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 260,
      easing: "ease-out",
      fill: "forwards"
    });
    motion.addEventListener("finish", () => {
      holder.style.transform = `translateX(${to}px)`;
      motion.cancel();
    }, { once: true });
    return true;
  }
  const phase = gaitStep % 2;
  gaitStep += 1;
  let started = false;
  const begin = () => {
    if (started) return;
    started = true;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      avatar.classList.add(direction === "right" ? "travel-right" : "travel-left", phase === 0 ? "step-a" : "step-b");
    }));
  };
  avatar.addEventListener("load", begin, { once: true });
  avatar.src = currentCharacterAsset(`walk-${direction}`);
  if (avatar.complete) begin();
  return true;
}

function stepMovementTrack(avatar, direction) {
  const directionStep = direction === "right" ? 1 : -1;
  const nextPosition = Math.max(-3, Math.min(3, walkPosition + directionStep));
  if (nextPosition === walkPosition) return false;
  walkPosition = nextPosition;
  advanceDirectionalWalkFrame(avatar, direction);
  avatar.style.left = `calc(50% + ${walkPosition * 42}px)`;
  return true;
}

function getGeorgianVoice() {
  if (!window.speechSynthesis) return null;
  return window.speechSynthesis.getVoices().find(voice => /^ka(?:-|_|$)/i.test(voice.lang)) || null;
}

function speak(message, notifyWhenUnavailable = false) {
  if (!soundOn || !window.speechSynthesis) return;
  const georgianVoice = getGeorgianVoice();
  if (!georgianVoice) {
    if (notifyWhenUnavailable) showToast("ქართული ხმა ამ ბრაუზერში არ არის");
    return;
  }
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(message);
  utterance.voice = georgianVoice;
  utterance.lang = "ka-GE";
  utterance.rate = 0.82;
  utterance.pitch = 1.05;
  window.speechSynthesis.speak(utterance);
}

function moveOneStair(direction, practice = false) {
  const current = practice ? stairLevel : direction === "up" ? upStairLevel : downStairLevel;
  const delta = direction === "up" ? 1 : -1;
  const next = Math.max(0, Math.min(4, current + delta));
  if (next === current) {
    feedback(false, direction === "up" ? "კიბის თავში ხარ." : "კიბის ძირში ხარ.");
    speak(direction === "up" ? "კიბის თავში ხარ." : "კიბის ძირში ხარ.");
    return false;
  }
  const demo = practice ? content.querySelector("[data-stair-demo]") : content.querySelector(`[data-stair-demo="${direction}"]`);
  const avatar = demo.querySelector(".stair-avatar");
  const buttons = practice ? content.querySelectorAll("[data-stair-move]") : demo.querySelectorAll("[data-stair-move]");
  buttons.forEach(button => { button.disabled = true; });
  stairGait += 1;
  stairGaitByDirection[direction] = (stairGaitByDirection[direction] || 0) + 1;
  const phase = stairGaitByDirection[direction];
  avatar.classList.add(phase % 2 ? "step-a" : "step-b");
  avatar.src = verticalActor === "rabbit" ? stairCharacterAsset(direction, 1) : stairCharacterAsset(direction, phase);
  if (practice) stairLevel = next;
  else if (direction === "up") upStairLevel = next;
  else downStairLevel = next;
  const board = demo.querySelector(".number-staircase");
  board.className = `number-staircase ${direction === "down" ? "descending" : "ascending"} level-${next}`;
  board.dataset.level = next;
  const word = direction === "up" ? "ზევით" : "ქვევით";
  const message = verticalActor === "rabbit"
    ? direction === "up"
      ? "კურდღელი ორივე ფეხით ასკუპდა ზევით და დადგა საფეხურზე."
      : "კურდღელი ორივე ფეხით ჩამოსკუპდა ქვევით და დადგა საფეხურზე."
    : `ერთი საფეხური ${word} — ფეხი შეცვალა და დადგა.`;
  feedback(true, message);
  speak(message);
  window.setTimeout(() => {
    if (verticalActor === "rabbit") avatar.src = stairCharacterAsset(direction, 0);
    avatar.classList.remove("step-a", "step-b");
    if (!practice) buttons.forEach(button => { button.disabled = false; });
  }, 520);
  return true;
}

  }));

    feedback(moved, moved ? `ერთი ნაბიჯი ${word} — ფეხი გაშალა და დადგა.` : "აქ გაჩერდი. მეორე მხარეს წადი.");
    speak(moved ? `ერთი ნაბიჯი ${word}. ფეხი გაშალა და დადგა.` : "აქ გაჩერდი.");

  }));
  announce("მარჯვენა. მარცხენა. აირჩიე მოქმედება.");

function relationPrompt(challenge) {
  const character = characterOptions[selectedCharacter].label;

        <div class="instruction child-instruction"><span class="instruction-number">3</span><div><h3>${message}</h3><p>გადაიტანე პერსონაჟი ან შეეხე სწორ ადგილს.</p></div>${audioButton(message)}</div>
        <div id="relationBoard">${relationVisual(challenge)}</div>
        <div class="drag-tray compact-tray"><img id="relationAvatar" class="drag-token draggable back-token" draggable="true" src="${currentCharacterAsset()}" alt="${characterOptions[selectedCharacter].alt} ზურგით დგას"></div>
        <div class="feedback" id="feedback">მოუსმინე და იპოვე სწორი ადგილი.</div>
      </div>
      <aside class="side-note picture-note">
        <div class="speech"><strong>${generated ? `ახალი დავალება ${relationRound + 1} · 3-დან` : "ჯერ ერთი ნიმუში"}</strong>ადგილი განისაზღვრება ობიექტის მიმართ.</div>
        ${generated ? "" : `<button class="secondary-btn" id="replayObject">მითითების გამეორება 🔊</button>`}
      </aside>
    </div>`;
  bindAudio(content);
  const avatar = content.querySelector("#relationAvatar");
  const zones = content.querySelectorAll("[data-relation]");
  let active = null;
  avatar.addEventListener("dragstart", () => { active = avatar; });
  zones.forEach(zone => {
    zone.addEventListener("dragover", event => { event.preventDefault(); zone.classList.add("hover"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("hover"));
    zone.addEventListener("drop", event => { event.preventDefault(); zone.classList.remove("hover"); if (active) placeInRelation(zone, challenge, generated); });
    zone.addEventListener("click", () => placeInRelation(zone, challenge, generated));
  });
  const replay = content.querySelector("#replayObject");
  if (replay) replay.addEventListener("click", () => speak(message));
  announce(message);
}

function placeInRelation(zone, challenge, generated) {
  if (zone.classList.contains("correct")) return;
  const ok = zone.dataset.relation === challenge.relation;
  if (!ok) {
    feedback(false, "კიდევ დააკვირდი ობიექტს და ისარს.");
    speak("კიდევ სცადე.");
    return;
  }
  zone.appendChild(content.querySelector("#relationAvatar"));
  zone.classList.add("correct");
  feedback(true, "სწორია!");
  speak("სწორია!");
  if (!generated) {
    award(2);
    const aside = content.querySelector(".side-note");
    aside.insertAdjacentHTML("beforeend", `<button class="primary-btn" id="startGenerated">ახალი დავალებები →</button>`);
    content.querySelector("#startGenerated").addEventListener("click", () => setStage("check"));
    return;
  }
  relationScore += 1;
  window.setTimeout(() => {
    relationRound += 1;
    if (relationRound < 3) renderGeneratedRelation();
    else finishGeneratedRelations();
  }, 850);
}

function createRelationChallenge() {
  const relations = ["left", "right", "between"];
  const relation = relations[relationRound % relations.length];
  const pool = [...relationObjects].sort(() => Math.random() - 0.5);
  return { relation, first: pool[0], second: pool[1] };
}

function renderGeneratedRelation() {
  renderDirectionRelation(createRelationChallenge(), true);
}

function finishGeneratedRelations() {
  award(3);
  content.innerHTML = `<div class="result-panel lesson-result"><div class="result-medal">⭐</div><h3>ოთხივე დავალება სწორად შეასრულე!</h3><p>შენ შეგიძლია საგნები განათავსო მარჯვნივ, მარცხნივ და შორის.</p><button class="primary-btn" id="nextLesson">შემდეგი გაკვეთილი →</button></div>`;
  content.querySelector("#nextLesson").addEventListener("click", () => parent.postMessage({type:'direction-navigate',mode:'vertical'},'*'));
  speak("ყოჩაღ! ოთხივე დავალება სწორად შეასრულე.");
}

function objectCheckPrompt(challenge) {
  if (challenge.relation === "between") return `დადე ${challenge.moving.spoken} ${challenge.first.spoken} და ${challenge.second.spoken} შორის.`;
  return `დადე ${challenge.moving.spoken} ${challenge.first.of} ${challenge.relation === "right" ? "მარჯვნივ" : "მარცხნივ"}.`;
}

function objectCheckVisual(challenge) {
  if (challenge.relation === "between") {
    return `<div class="relation-board between-board object-check-board">
      <div class="fixed-object"><img src="${objectAsset(challenge.first.file)}" alt="${challenge.first.alt}"></div>
      <button class="relation-zone middle-zone" data-relation="between" aria-label="შორის"><span class="zone-symbol">↔</span><small>შორის</small></button>
      <div class="fixed-object"><img src="${objectAsset(challenge.second.file)}" alt="${challenge.second.alt}"></div>
    </div>`;
  }
  return `<div class="relation-board object-check-board">
    <button class="relation-zone left-zone" data-relation="left" aria-label="მარცხნივ"><span class="zone-symbol brown">←</span><small>მარცხნივ</small></button>
    <div class="fixed-object"><img src="${objectAsset(challenge.first.file)}" alt="${challenge.first.alt}"></div>
    <button class="relation-zone right-zone" data-relation="right" aria-label="მარჯვნივ"><span class="zone-symbol blue">→</span><small>მარჯვნივ</small></button>
  </div>`;
}

function renderObjectCheck() {
  const challenge = objectCheckChallenges[relationRound];
  const visual = challenge.type === "identify" ? identifyCheckVisual(challenge) : arrangementCheckVisual(challenge);
  content.innerHTML = `
    <div class="stage-panel direction-stage">
      <div class="activity-area">
        <div class="instruction child-instruction"><span class="instruction-number">${relationRound + 1}</span><div><h3>${challenge.prompt}</h3><p>შეეხე სწორ სურათს.</p></div>${audioButton(challenge.voice)}</div>
        ${visual}
        <details class="hint-box">
          <summary>
            <span class="hint-icon" aria-hidden="true">💡</span>
            <span class="hint-title">მინიშნება</span>
            <span class="hint-badge">დააჭირე სანახავად</span>
            <span class="hint-arrow">▼</span>
          </summary>
          <div class="hint-content">
            ${challenge.type === "identify" ? "ჯერ იპოვე დასახელებული საგანი, შემდეგ შეხედე მის გვერდებს." : "სურათებს მარცხნიდან მარჯვნივ დააკვირდი."}
          </div>
        </details>
        <div class="feedback" id="feedback" hidden></div>
      </div>
      <aside class="side-note picture-note">
        <div class="check-progress"><strong>${relationRound + 1} / ${objectCheckChallenges.length}</strong><div>${objectCheckChallenges.map((_, i) => `<i class="${i < relationRound ? "done" : i === relationRound ? "now" : ""}"></i>`).join("")}</div></div>
        <div class="speech"><strong>${challenge.book ? "წიგნის მსგავსი მაგალითი" : "ახალი ვიზუალური მაგალითი"}</strong>${challenge.book ? "პირველი ოთხი დავალება წიგნის მოქმედებებს იმეორებს." : "ერთი შეხება საკმარისია — კითხვა და სურათი ყოველ ჯერზე იცვლება."}</div>
      </aside>
    </div>`;
  bindAudio(content);
  content.querySelectorAll("[data-check-answer]").forEach(button => {
    button.addEventListener("click", () => chooseObjectCheck(button, challenge));
  });
  announce(challenge.voice);
}

function checkObjectImage(key) {
  const item = checkObjects[key];
  return `<img src="${objectAsset(item.file)}" alt="${item.alt}">`;
}

function arrangementCheckVisual(challenge) {
  return `<div class="check-choice-grid ${challenge.choices.length === 2 ? "two" : ""}">${challenge.choices.map((choice, index) => {
    const items = choice.map(key => {
      if (challenge.kind === "characters" || challenge.kind === "walk") return `<img src="${asset(key)}" alt="პერსონაჟი">`;
      return checkObjectImage(key);
    }).join("");
    const arrow = challenge.kind === "walk" ? `<span class="choice-direction ${index === 0 ? "brown" : "blue"}">${index === 0 ? "←" : "→"}</span>` : "";
    return `<button class="check-visual-choice ${choice.length === 3 ? "three-items" : ""}" type="button" data-check-answer="${index}" aria-label="პასუხი ${index + 1}"><div>${items}</div>${arrow}</button>`;
  }).join("")}</div>`;
}

function identifyCheckVisual(challenge) {
  return `<div class="identify-board">${challenge.row.map((key, index) => `<button type="button" class="identify-object ${index === challenge.reference ? "reference" : ""}" data-check-answer="${index}" aria-label="${checkObjects[key].spoken}">${checkObjectImage(key)}</button>`).join("")}</div>`;
}

function chooseObjectCheck(button, challenge) {
  if (button.disabled) return;
  const selected = Number(button.dataset.checkAnswer);
  if (selected !== challenge.answer) {
    button.classList.add("wrong");
    feedback(false, "კიდევ დააკვირდი ისარს და საყრდენ საგანს.");
    speak("კიდევ სცადე.");
    return;
  }
  content.querySelectorAll("[data-check-answer]").forEach(option => { option.disabled = true; });
  button.classList.add("correct");
  feedback(true, "სწორია!");
  relationScore += 1;
  speak("სწორია!");
  window.setTimeout(() => {
    relationRound += 1;
    if (relationRound < objectCheckChallenges.length) renderObjectCheck();
    else finishObjectCheck();
  }, 700);
}

function finishObjectCheck() {
  award(3);
  content.innerHTML = `<div class="result-panel lesson-result"><div class="result-medal">⭐</div><h3>ათივე დავალება შეასრულე!</h3><p>შენ არჩევ მარჯვენას, მარცხენას და შორის მდებარეობას.</p><button class="primary-btn" id="nextLesson">შემდეგი გაკვეთილი →</button></div>`;
  content.querySelector("#nextLesson").addEventListener("click", () => parent.postMessage({type:'direction-navigate',mode:'vertical'},'*'));
  speak("ყოჩაღ! ათივე დავალება შეასრულე.");
}

function renderVerticalBookCheck() {
  const challenge = verticalCheckChallenges[verticalCheckRound];
  content.innerHTML = `
    <div class="stage-panel vertical-book-check-stage">
      <div class="activity-area">
        <div class="instruction child-instruction"><span class="instruction-number">${verticalCheckRound + 1}</span><div><h3>რომელია სწორი? მონიშნე.</h3><p>${challenge.prompt}</p></div>${audioButton(challenge.voice)}</div>
        <div class="book-drag-check choice-mode">
          <figure class="book-check-picture">
            <img src="assets/book/check/${challenge.image}" alt="${challenge.alt}">
            <figcaption>სახელმძღვანელო, გვ. 8</figcaption>
          </figure>
          <div class="vertical-choice-panel">
            <p>${challenge.prompt}</p>
            <div class="vertical-word-tray" role="group" aria-label="პასუხის ვარიანტები">
              <button type="button" class="vertical-word-token up-word" data-vertical-word="up"><span>↑</span>ზევით</button>
              <button type="button" class="vertical-word-token down-word" data-vertical-word="down"><span>↓</span>ქვევით</button>
            </div>
          </div>
        </div>
        <details class="hint-box">
          <summary>
            <span class="hint-icon" aria-hidden="true">💡</span>
            <span class="hint-title">წიგნიდან</span>
            <span class="hint-badge">დააჭირე სანახავად</span>
            <span class="hint-arrow">▼</span>
          </summary>
          <div class="hint-content">
            ჯერ დააკვირდი, საით მოძრაობს ბავშვი ან საით არის მიმართული მოქმედება.
          </div>
        </details>
        <div class="feedback" id="feedback" hidden></div>
      </div>
      <aside class="side-note picture-note">
        <div class="vertical-star-counter" aria-live="polite"><span>★</span><div><strong id="verticalStarCount">${verticalCheckScore}</strong><small>4 ვარსკვლავიდან</small></div></div>
        <div class="check-progress"><strong>${verticalCheckRound + 1} / ${verticalCheckChallenges.length}</strong><div>${verticalCheckChallenges.map((_, index) => `<i class="${index < verticalCheckRound ? "done" : index === verticalCheckRound ? "now" : ""}"></i>`).join("")}</div></div>
        <div class="speech"><strong>როგორ შეამოწმო</strong>დააკვირდი წიგნის სურათს და მონიშნე ერთი სწორი პასუხი. სწორ პასუხზე ვარსკვლავს მიიღებ.</div>
      </aside>
    </div>`;
  bindAudio(content);
  bindVerticalChoiceCheck(challenge);
  announce(challenge.voice);
}

function bindVerticalChoiceCheck(challenge) {
  const tokens = [...content.querySelectorAll("[data-vertical-word]")];
  let answered = false;

  const submit = (word, token) => {
    if (answered || !word) return;
    if (word !== challenge.answer) {
      token?.classList.add("wrong");
      feedback(false, "კიდევ დააკვირდი სურათს: მოქმედება ზევითაა მიმართული თუ ქვევით?");
      speak("კიდევ დააკვირდი და სცადე.");
      window.setTimeout(() => token?.classList.remove("wrong"), 500);
      return;
    }
    answered = true;
    verticalCheckScore += 1;
    const count = content.querySelector("#verticalStarCount");
    if (count) count.textContent = verticalCheckScore;
    tokens.forEach(item => { item.disabled = true; });
    token.classList.add("correct");
    const star = document.createElement("div");
    star.className = "answer-star-pop";
    star.setAttribute("aria-hidden", "true");
    star.textContent = "★";
    content.querySelector(".book-drag-check")?.appendChild(star);
    window.setTimeout(() => star.remove(), 900);
    feedback(true, "სწორია! პასუხი წიგნის სურათს შეესაბამება.");
    speak("სწორია!");
    window.setTimeout(() => {
      verticalCheckRound += 1;
      if (verticalCheckRound < verticalCheckChallenges.length) renderVerticalBookCheck();
      else finishVerticalBookCheck();
    }, 750);
  };

  tokens.forEach(token => token.addEventListener("click", () => submit(token.dataset.verticalWord, token)));
}

function finishVerticalBookCheck() {
  award(3);
  content.innerHTML = `<div class="result-panel lesson-result"><div class="result-medal">⭐</div><div class="final-star-score">★ ${verticalCheckScore} / ${verticalCheckChallenges.length}</div><h3>ოთხივე მაგალითი სწორად შეასრულე!</h3><p>შენ წიგნის სურათებში არჩევ ზევით და ქვევით მიმართულებებს.</p><button class="primary-btn" id="nextLesson">შემდეგი გაკვეთილი →</button></div>`;
  content.querySelector("#nextLesson").addEventListener("click", () => parent.postMessage({type:'direction-navigate',mode:'comparison'},'*'));
  speak("ყოჩაღ! ოთხივე მაგალითი სწორად შეასრულე.");
}

function drawTask(lesson) {
  const board = document.querySelector("#practiceBoard");
  if (["horizontal", "vertical"].includes(lesson.mode)) {
    const keys = lesson.mode === "horizontal" ? ["left","between","right"] : ["above","middle","below"];
    board.innerHTML = `<div class="drop-board">${lesson.zones.map((z,i)=>`<div class="drop-zone" data-zone="${keys[i]}">${z}</div>`).join("")}</div><div class="drag-tray"><img class="drag-token draggable" draggable="true" src="${lesson.mode === "horizontal" ? asset("girl-neutral") : objectAsset("ball-orange")}" alt="გადასატანი ობიექტი"></div>`;
    enableDrag(board.querySelector(".draggable"), board.querySelectorAll(".drop-zone"), lesson.answer);
  } else if (lesson.mode === "container") {
    board.innerHTML = `<div class="drop-board" style="grid-template-columns:1fr 1fr"><div class="drop-zone" data-zone="outside">გარეთ</div><div class="drop-zone" data-zone="inside" style="border-style:solid;border-width:8px;border-top-width:2px">ყუთის შიგნით</div></div><div class="drag-tray"><img class="drag-token draggable" draggable="true" src="${objectAsset("ball-orange")}" alt="ბურთი"></div>`;
    enableDrag(board.querySelector(".draggable"), board.querySelectorAll(".drop-zone"), lesson.answer);
  } else {
    const choices = taskChoices(lesson.mode);
    board.innerHTML = `<div class="choice-grid">${choices.map((c,i)=>`<button class="choice" data-i="${i}">${c}</button>`).join("")}</div>`;
    board.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => evaluateChoice(btn, Number(btn.dataset.i), lesson.answer)));
  }
}

function taskChoices(mode) {
  if (mode === "arrangement") return [
    `<div class="visual-choice"><img src="${asset("boy-neutral")}" height="90" alt="ბიჭი"><img src="${asset("girl-neutral")}" height="55" alt="გოგონა"></div>წინ და უკან`,
    `<div class="visual-choice"><img src="${asset("boy-neutral")}" height="85" alt="ბიჭი"><img src="${asset("girl-neutral")}" height="85" alt="გოგონა"></div>გვერდით`,
    `<div class="visual-choice"><img src="${asset("boy-neutral")}" height="55" alt="ბიჭი"><img src="${asset("girl-neutral")}" height="90" alt="გოგონა"></div>უკან და წინ`];
  if (mode === "size") return [
    `<div class="visual-choice"><img src="${objectAsset("basketball-large")}" height="105" alt="დიდი ბურთი"></div>დიდი`,
    `<div class="visual-choice"><img src="${objectAsset("ball-orange")}" height="58" alt="პატარა ბურთი"></div>პატარა`,
    `<div class="visual-choice"><img src="${objectAsset("cube-blue-large")}" height="78" alt="კუბიკი"></div>სხვა საგანი`];
  return [
    `<div class="visual-choice">${counterSet(5,"#ef6461")}</div>წითელი`,
    `<div class="visual-choice">${counterSet(3,"#398fd1")}</div>ლურჯი`,
    `<div class="visual-choice">${counterSet(4,"#51ad70")}</div>იმდენივე`];
}

function enableDrag(token, zones, correct) {
  let active = null;
  token.addEventListener("dragstart", () => active = token);
  zones.forEach(zone => {
    zone.addEventListener("dragover", e => { e.preventDefault(); zone.classList.add("hover"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("hover"));
    zone.addEventListener("drop", e => { e.preventDefault(); zone.classList.remove("hover"); if(active){ zone.appendChild(active); evaluateDrop(zone, correct); } });
    zone.addEventListener("click", () => { zone.appendChild(token); evaluateDrop(zone, correct); });
  });
}

function evaluateDrop(zone, correct) {
  const ok = zone.dataset.zone === correct;
  zone.classList.toggle("correct", ok);
  feedback(ok, ok ? "სწორია! მდებარეობა ზუსტად განსაზღვრე." : "კიდევ დააკვირდი საყრდენ საგანს და სცადე თავიდან.");
  if (ok) award(2);
}

function evaluateChoice(button, selected, correct) {
  const ok = selected === correct;
  document.querySelectorAll(".choice").forEach(b => b.classList.remove("correct","wrong"));
  button.classList.add(ok ? "correct" : "wrong");
  feedback(ok, ok ? "სწორია! კარგად დააკვირდი სურათს." : "ჯერ შეადარე მხოლოდ ერთნაირი საგნები და სცადე კიდევ.");
  if (ok) award(2);
}

function feedback(ok, message) {
  const box = document.querySelector("#feedback");
  if (!box) return;
  box.hidden = false;
  box.className = `feedback ${ok ? "good" : "try"}`;
  box.textContent = message;
  showToast(ok ? "ყოჩაღ! ★" : "კიდევ ერთხელ სცადე");
}

function award(n) { scores[currentLesson] = Math.max(scores[currentLesson], n); stars.textContent = `${"★ ".repeat(scores[currentLesson])}${"☆ ".repeat(3 - scores[currentLesson])}`.trim(); }

function renderCheck(lesson) {
  if (currentLesson === 0) {
    relationRound = 0;
    relationScore = 0;
    renderObjectCheck();
    return;
  }
  if (currentLesson === 1) {
    verticalCheckRound = 0;
    verticalCheckScore = 0;
    renderVerticalBookCheck();
    return;
  }
  const q = quiz[currentLesson];
  content.innerHTML = `<div class="stage-panel"><div class="activity-area"><div class="instruction"><span class="instruction-number">3</span><div><h3>${q.q}</h3><p>აირჩიე ერთი პასუხი.</p></div></div><div class="choice-grid">${q.o.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join("")}</div><div class="feedback" id="feedback">მზად ხარ? აირჩიე პასუხი.</div></div><aside class="side-note"><div class="speech"><strong>შეამოწმე თავი</strong>პასუხამდე ჩუმად თქვი, რას ხედავ სურათში ან ამოცანაში.</div><button class="primary-btn" id="nextLesson">${currentLesson < lessons.length - 1 ? "შემდეგი გაკვეთილი" : "თავის ვიქტორინა"}</button></aside></div>`;
  content.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => {
    const ok = Number(btn.dataset.i) === q.a;
    content.querySelectorAll(".choice").forEach(b => b.classList.remove("correct","wrong"));
    btn.classList.add(ok ? "correct" : "wrong");
    feedback(ok, ok ? "სწორია — ცოდნა დამოუკიდებლად გამოიყენე!" : "ჯერ გაიხსენე ახსნა და კვლავ სცადე.");
    if (ok) award(3);
  }));
  content.querySelector("#nextLesson").addEventListener("click", () => currentLesson < lessons.length - 1 ? openLesson(currentLesson + 1) : openQuiz());
}

function setStage(stage) {
  if (currentLesson === 1 && stage === "practice" && currentStage !== "practice") {
    verticalPracticeRound = 0;
    verticalPracticeScore = 0;
    verticalPracticeMoves = { up: 0, down: 0 };
    upStairLevel = 0;
    downStairLevel = 4;
  }
  currentStage = stage;
  document.querySelectorAll(".stage-tab").forEach(tab => tab.classList.toggle("active", tab.dataset.stage === stage));
  render();
}

document.querySelectorAll(".stage-tab").forEach(tab => tab.addEventListener("click", () => setStage(tab.dataset.stage)));

function openQuiz() {
  learningCard.hidden = true;
  quizCard.hidden = false;
  quizIndex = 0;
  quizAnswers = Array(quiz.length).fill(null);
  buildStrip();
  strip.lastElementChild.classList.add("active");
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const q = quiz[quizIndex];
  document.querySelector("#quizScore").textContent = `${quizAnswers.filter((a,i)=>a===quiz[i].a).length} / ${quiz.length}`;
  document.querySelector("#quizBody").innerHTML = `<div class="quiz-content"><div class="quiz-question"><p class="eyebrow">კითხვა ${quizIndex + 1} · ${quiz.length}-დან</p><h3>${q.q}</h3><div class="quiz-options">${q.o.map((o,i)=>`<button class="quiz-option ${quizAnswers[quizIndex]===i ? "selected" : ""}" data-i="${i}">${o}</button>`).join("")}</div></div><div class="quiz-actions"><button class="secondary-btn" id="prevQuiz" ${quizIndex===0?"disabled":""}>წინა</button><button class="primary-btn" id="nextQuiz">${quizIndex===quiz.length-1?"დასრულება":"შემდეგი"}</button></div></div>`;
  document.querySelectorAll(".quiz-option").forEach(btn => btn.addEventListener("click", () => { quizAnswers[quizIndex] = Number(btn.dataset.i); renderQuizQuestion(); }));
  document.querySelector("#prevQuiz").addEventListener("click", () => { if (quizIndex) { quizIndex--; renderQuizQuestion(); } });
  document.querySelector("#nextQuiz").addEventListener("click", () => {
    if (quizAnswers[quizIndex] === null) { showToast("ჯერ აირჩიე პასუხი"); return; }
    if (quizIndex < quiz.length-1) { quizIndex++; renderQuizQuestion(); } else renderQuizResult();
  });
}

function renderQuizResult() {
  const score = quizAnswers.filter((a,i)=>a===quiz[i].a).length;
  document.querySelector("#quizScore").textContent = `${score} / ${quiz.length}`;
  const msg = score === quiz.length ? "შესანიშნავია — ყველა ცნება კარგად გაიგე!" : score >= 4 ? "კარგია — კიდევ ერთხელ გაიხსენე რთული საკითხები." : "დაუბრუნდი ახსნას და მშვიდად ივარჯიშე.";
  document.querySelector("#quizBody").innerHTML = `<div class="result-panel"><div class="result-medal">${score===quiz.length?"🏆":score>=4?"⭐":"🌱"}</div><h3>${score} სწორი პასუხი</h3><p>${msg}</p><button class="primary-btn" id="retryQuiz">ვიქტორინის გამეორება</button></div>`;
  document.querySelector("#retryQuiz").addEventListener("click", openQuiz);
}

document.querySelector("#soundBtn").addEventListener("click", e => {
  if (!getGeorgianVoice()) {
    soundOn = false;
    e.currentTarget.textContent = "🔇";
    showToast("ქართული ხმა ამ ბრაუზერში არ არის");
    return;
  }
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "🔊" : "🔇";
});

if (window.speechSynthesis) {
  window.speechSynthesis.addEventListener("voiceschanged", syncAudioControls);
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1500);
}

openLesson(window.initialMode === "vertical" ? 1 : 0);
syncAudioControls();
</script></body>
</html>
